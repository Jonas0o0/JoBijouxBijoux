name: CI/CD Pipeline - ERP Bijoux

on:
  push:
    branches:
      - '**'        # Exécution automatique des tests à CHAQUE push sur TOUTES les branches
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '**'

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Tests Unitaires & Intégration (Maven & Testcontainers)
  # -------------------------------------------------------------
  backend-test:
    name: Backend Tests (Java 21 / Maven / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Local Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile and Run All Backend Tests
        run: |
          echo "🚀 Exécution des tests Maven à chaque push..."
          mvn -B clean test -f backend/pom.xml --no-transfer-progress

      - name: Publish Test Report (Surefire)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: "backend/**/target/surefire-reports/*.txt"
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Frontend & Hardware Agent Linting, Typecheck & Tests
  # -------------------------------------------------------------
  frontend-test:
    name: Frontend & Agent Tests (Node 20 / TypeScript / pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Turborepo Lint & Typecheck
        run: pnpm run lint || true

      - name: Build All Frontends & Packages
        run: pnpm run build || true

  # -------------------------------------------------------------
  # Job 3: Scan de Sécurité et Vulnérabilités (Trivy)
  # -------------------------------------------------------------
  security-trivy:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on repo
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
