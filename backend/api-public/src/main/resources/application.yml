spring:
  application:
    name: erp-bijoux-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erp_bijoux}
    username: ${SPRING_DATASOURCE_USERNAME:erp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:erp_secure_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ErpBijouxHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain

erp:
  fiscal:
    sealing-secret: ${ERP_FISCAL_SEALING_SECRET:ERP_BIJOUX_PRODUCTION_SEALING_KEY_NF525_VERY_LONG_SECRET}
  security:
    jwt:
      secret: ${ERP_JWT_SECRET:ERP_BIJOUX_JWT_SIGNING_KEY_2026_PHASE_1_HBJO_VERY_LONG_AND_SECURE}
      expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){magenta} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    fr.bijoux.erp: DEBUG
    org.springframework.security: INFO
    org.springframework.modulith: INFO
